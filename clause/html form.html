<!DOCTYPE html>
<html>

<head>
    <title>Student Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        Name :
        <input type="text">

        <br><br>

        Gender :
        <select>

            <option>Male</option>

            <option>Female</option>

        </select>

        <br><br>

        Date of Birth :
        <input type="date">

        <br><br>

        Email :
        <input type="email">

        <br><br>

        Phone Number :
        <input type="number">

        <br><br>

        Course :
        <select>

            <option>BCA</option>

            <option>B.Sc</option>

            <option>B.Com</option>

        </select>

        <br><br>

        Skills :

        <input type="checkbox"> HTML

        <input type="checkbox"> CSS

        <input type="checkbox"> Java

        <br><br>

        Address :

        <br>

        <textarea rows="5" cols="30"></textarea>

        <br><br>

        Password :
        <input type="password">

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>

</html>
